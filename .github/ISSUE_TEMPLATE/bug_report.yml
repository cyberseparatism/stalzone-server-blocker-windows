name: Баг
about: Сообщить о проблеме
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Спасибо за сообщение. Не публикуйте пароли, токены и другие чувствительные данные.
  - type: input
    id: version
    attributes:
      label: Версия приложения
      placeholder: v0.1.6
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Версия Windows и масштаб интерфейса
      placeholder: Windows 11 24H2, 125%
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      description: Опишите шаги по порядку.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Что произошло
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Журнал / скриншоты
      description: Перетащите сюда скриншот или вставьте журнал приложения.
